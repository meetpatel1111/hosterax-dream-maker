  <!-- Centered Bold "Hx" Monogram -->
  <text 
    x="38" 
    y="51" 
    text-anchor="middle" 
    font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
    font-weight="800" 
    font-size="32" 
    fill="#09090b"
