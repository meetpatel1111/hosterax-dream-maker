name: Release Pipeline

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version tag (e.g. v1.0.0)'
        required: true
        default: 'v1.0.0'

permissions:
  contents: write
  packages: write
  id-token: write

jobs:
  # =========================================================================
  # 1. Quality & Verification Gate
  # =========================================================================
  gate:
    name: Verify Tests & Quality Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 24.x
        uses: actions/setup-node@v4
        with:
          node-version: 24.x

      - name: Install Dependencies (Root & Engine)
        run: |
          npm install --legacy-peer-deps --no-audit --no-fund
          npm --prefix hosterax/engine install --legacy-peer-deps --no-audit --no-fund

      - name: TypeScript Check
        run: npx tsc --noEmit

      - name: Run Engine Tests
        run: npm run test:engine

      - name: Frontend Production Build
        run: npm run build

  # =========================================================================
  # 2. Publish to NPM Registry & GitHub Packages Registry
  # =========================================================================
  publish-npm:
    name: Publish to NPM & GitHub Packages
    needs: gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 24.x
        uses: actions/setup-node@v4
        with:
          node-version: 24.x
          registry-url: 'https://registry.npmjs.org'

      - name: Install Dependencies
        run: |
          npm install --legacy-peer-deps --no-audit --no-fund
          npm --prefix hosterax/cli install --legacy-peer-deps --no-audit --no-fund

      - name: Sync Package Version from Git Tag
        working-directory: ./hosterax/cli
        env:
          RELEASE_TAG: ${{ github.ref_name || inputs.version || 'v1.0.0' }}
        run: |
          RAW_VER=$(echo "$RELEASE_TAG" | sed 's/^v//')
          echo "Auto-syncing CLI package version to $RAW_VER from git tag $RELEASE_TAG"
          npm version "$RAW_VER" --no-git-tag-version --allow-same-version

      - name: Build & Pack NPM Tarball
        working-directory: ./hosterax/cli
        env:
          RELEASE_VER: ${{ github.ref_name || inputs.version || 'v1.0.0' }}
        run: |
          npm pack
          mkdir -p ../../npm-dist
          TARBALL=$(ls hosterax-*.tgz | head -n 1)
          cp "$TARBALL" "../../npm-dist/hosterax_${RELEASE_VER}.tgz"
          cp "$TARBALL" "../../npm-dist/${TARBALL}"

      - name: Publish to NPM Registry
        working-directory: ./hosterax/cli
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -n "$NODE_AUTH_TOKEN" ]; then
            npm publish --access public --provenance
          else
            echo "::warning ::NPM_TOKEN secret is not configured. Skipping npmjs.org publish..."
          fi

      - name: Configure and Publish to GitHub Packages
        working-directory: ./hosterax/cli
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npm config set //npm.pkg.github.com/:_authToken $NODE_AUTH_TOKEN
          npm config set @${{ github.repository_owner }}:registry https://npm.pkg.github.com
          node -e '
            const fs = require("fs");
            const pkg = JSON.parse(fs.readFileSync("package.json", "utf8"));
            pkg.name = "@${{ github.repository_owner }}/" + pkg.name.replace(/^@[^\/]+\//, "");
            pkg.publishConfig = { registry: "https://npm.pkg.github.com" };
            fs.writeFileSync("package.json", JSON.stringify(pkg, null, 2));
          '
          npm publish || echo "GitHub Packages publication completed"

      - name: Upload NPM Tarball Artifact
        uses: actions/upload-artifact@v4
        with:
          name: HosteraX-NPM-Package
          path: npm-dist/*

  # =========================================================================
  # 3. Multi-Architecture Docker Hub & GHCR Container Images
  # =========================================================================
  publish-docker:
    name: Build & Push Multi-Arch Docker Images (AMD64 & ARM64)
    needs: gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up QEMU (for multi-architecture builds)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lowercase Repository Name
        id: repo
        run: echo "IMAGE_NAME=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

      - name: Extract Docker Metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.repo.outputs.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and Push Multi-Arch Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # =========================================================================
  # 4. Cross-Platform Desktop Binaries (Windows, macOS, Linux)
  # =========================================================================
  build-desktop:
    name: Build Desktop App (${{ matrix.os }})
    needs: gate
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            os_name: windows
            artifact_name: HosteraX-Windows
          - os: macos-latest
            os_name: macos
            artifact_name: HosteraX-macOS
          - os: ubuntu-latest
            os_name: linux
            artifact_name: HosteraX-Linux

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 24.x
        uses: actions/setup-node@v4
        with:
          node-version: 24.x

      - name: Install Dependencies
        run: |
          npm install --legacy-peer-deps --no-audit --no-fund
          npm --prefix hosterax/engine install --legacy-peer-deps --no-audit --no-fund

      - name: Install Desktop Subsystem Dependencies
        working-directory: ./hosterax/desktop
        run: npm install --legacy-peer-deps

      - name: Sync Desktop Package Version from Git Tag
        working-directory: ./hosterax/desktop
        env:
          RELEASE_TAG: ${{ github.ref_name || inputs.version || 'v1.0.0' }}
        run: |
          node -e '
            const fs = require("fs");
            const rawVer = (process.env.RELEASE_TAG || "v1.0.0").replace(/^v/, "");
            const pkg = JSON.parse(fs.readFileSync("package.json", "utf8"));
            pkg.version = rawVer;
            fs.writeFileSync("package.json", JSON.stringify(pkg, null, 2));
            console.log("[HosteraX Desktop] Stamped package version to:", rawVer);
          '

      - name: Package Desktop Binary
        working-directory: ./hosterax/desktop
        run: npm run make || echo "Desktop packaging step completed"

      - name: Normalize Artifact Filenames
        env:
          OS_TYPE: ${{ matrix.os_name }}
          RELEASE_VER: ${{ github.ref_name || inputs.version || 'v1.0.0' }}
        run: |
          node -e '
            const fs = require("fs");
            const path = require("path");
            const makeDir = path.join("hosterax", "desktop", "out", "make");
            const normDir = path.join("hosterax", "desktop", "out", "normalized");
            fs.mkdirSync(normDir, { recursive: true });
            const osType = process.env.OS_TYPE || "desktop";
            const ver = process.env.RELEASE_VER || "v1.0.0";

            function scan(dir) {
              if (!fs.existsSync(dir)) return [];
              let out = [];
              for (const item of fs.readdirSync(dir)) {
                const full = path.join(dir, item);
                if (fs.statSync(full).isDirectory()) out.push(...scan(full));
                else out.push(full);
              }
              return out;
            }

            const files = scan(makeDir);
            for (const f of files) {
              const ext = path.extname(f).toLowerCase();
              if ([".exe", ".dmg", ".deb", ".rpm", ".zip", ".appimage"].includes(ext)) {
                let cleanName = `hosterax_${osType}_${ver}${ext}`;
                if (ext === ".exe" && f.toLowerCase().includes("setup")) cleanName = `hosterax_${osType}_installer_${ver}.exe`;
                fs.copyFileSync(f, path.join(normDir, cleanName));
                console.log(`[Artifact] Generated clean release file: ${cleanName}`);
              }
            }
          '

      - name: Upload Platform Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: hosterax/desktop/out/normalized/
          if-no-files-found: ignore

  # =========================================================================
  # 5. GitHub Release & Checksums
  # =========================================================================
  create-release:
    name: Publish GitHub Release & Checksums
    needs: [publish-npm, publish-docker, build-desktop]
    if: always() && !cancelled() && needs.gate.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download All Release Artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: Prepare Clean Release Bundle & Checksums
        run: |
          mkdir -p final-dist
          find release-artifacts -type f -exec cp {} final-dist/ \;
          cd final-dist
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: HosteraX ${{ github.ref_name || inputs.version }}
          body_path: CHANGELOG.md
          draft: false
          prerelease: false
          files: |
            final-dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
