name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test & Typecheck (${{ matrix.os }} - Node ${{ matrix.node-version }})
    runs-on: ${{ matrix.os }}
    # the slowest leg takes about five minutes; a hung test must not hold the run for the default six hours
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node-version: [22.x, 24.x]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install Dependencies (Root & Engine)
        run: |
          npm install --legacy-peer-deps --no-audit --no-fund
          npm --prefix hosterax/engine install --legacy-peer-deps --no-audit --no-fund

      - name: Check TypeScript Types
        run: npx tsc --noEmit

      - name: Run ESLint
        run: npm run lint

      - name: Check Prettier Formatting
        run: npx prettier --check "src/**/*.{ts,tsx}" "hosterax/**/*.{mjs,js,json}" "*.{md,json}"

      - name: Check Generated Reference Docs and Licences
        run: |
          npm run api:check
          npm run docs:check
          npm run licenses:check

      - name: Run Engine Test Suite
        run: npm run test:engine

      - name: Build Frontend Production Bundle
        run: npm run build

      - name: Build Dashboard Bundle Served by the Engine
        run: npm run build:engine

      - name: Prepare All-In-One NPM Package Bundle
        run: npm run package:npm

      - name: Verify CLI NPM Tarball (Dry Run)
        run: npm --prefix hosterax/cli pack --dry-run
