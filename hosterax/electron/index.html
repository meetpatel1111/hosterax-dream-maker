<!doctype html>
<html><head><meta charset="utf-8"><title>HosteraX</title>
<style>
  body{margin:0;background:#0a0a0a;color:#e5e5e5;font:14px/1.5 -apple-system,Segoe UI,sans-serif;padding:40px;max-width:720px;margin:0 auto}
  h1{color:#c6f832;margin:0 0 8px} code{background:#171717;padding:2px 6px;border-radius:4px}
  a{color:#c6f832} .card{background:#141414;border:1px solid #262626;border-radius:12px;padding:24px;margin:16px 0}
</style></head>
<body>
  <h1>HosteraX Desktop</h1>
  <p>Engine running at <code>http://localhost:7777</code>.</p>
  <div class="card">
    <h3>Point at your dashboard</h3>
    <p>Set <code>HOSTERAX_DASHBOARD_URL</code> before launch, or open the web dashboard and visit <code>/local</code>.</p>
    <p><a href="http://localhost:7777/health" target="_blank">Test engine →</a></p>
  </div>
  <div class="card">
    <h3>CLI</h3>
    <pre><code>hosterax login &lt;token&gt;
hosterax deploy ./my-app</code></pre>
  </div>
</body></html>
